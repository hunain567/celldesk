appId: com.nexoerp.celldesk
productName: CellDesk
copyright: Copyright © 2026 NexoERP
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  # Native SQLite binary must live outside the archive to be loaded.
  - node_modules/better-sqlite3-multiple-ciphers/**

# Locked-down Electron runtime switches. These cannot be changed after packaging.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: CellDesk
  artifactName: CellDesk-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CellDesk
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: CellDesk by NexoERP
  # Business data and backups are never removed by the uninstaller.
  deleteAppDataOnUninstall: false
